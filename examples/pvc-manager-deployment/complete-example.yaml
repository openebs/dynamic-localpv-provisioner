# Complete example for deploying OpenEBS Dynamic LocalPV Provisioner with PVC Manager
#
# This example demonstrates the new PVC Manager architecture that replaces
# helper pods with a DaemonSet-based HTTP service for volume operations.
#
# Apply in order:
# 1. kubectl apply -f complete-example.yaml
# 2. kubectl apply -f test-application.yaml (see below)

---
# Namespace for OpenEBS components
apiVersion: v1
kind: Namespace
metadata:
  name: openebs
  labels:
    name: openebs

---
# ServiceAccount for PVC Manager
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openebs-pvc-manager
  namespace: openebs
  labels:
    app: pvc-manager
    component: localpv-provisioner

---
# ClusterRole for PVC Manager
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openebs-pvc-manager
  labels:
    app: pvc-manager
    component: localpv-provisioner
rules:
- apiGroups: [""]
  resources: ["nodes", "persistentvolumes", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]

---
# ClusterRoleBinding for PVC Manager
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openebs-pvc-manager
  labels:
    app: pvc-manager
    component: localpv-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openebs-pvc-manager
subjects:
- kind: ServiceAccount
  name: openebs-pvc-manager
  namespace: openebs

---
# PVC Manager DaemonSet
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pvc-manager
  namespace: openebs
  labels:
    app: pvc-manager
    component: localpv-provisioner
    version: "1.0.0"
spec:
  selector:
    matchLabels:
      app: pvc-manager
  template:
    metadata:
      labels:
        app: pvc-manager
        component: localpv-provisioner
    spec:
      serviceAccountName: openebs-pvc-manager
      hostNetwork: false
      hostPID: false
      dnsPolicy: ClusterFirst
      containers:
      - name: pvc-manager
        image: openebs/pvc-manager:1.0.0
        imagePullPolicy: IfNotPresent
        args:
        - "--listen-addr=0.0.0.0:8080"
        - "--log-level=info"
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        securityContext:
          privileged: true
        volumeMounts:
        - name: basepath
          mountPath: /var/openebs/local
        - name: dev
          mountPath: /dev
        - name: proc
          mountPath: /host/proc
        - name: sys
          mountPath: /host/sys
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi
      volumes:
      - name: basepath
        hostPath:
          path: /var/openebs/local
          type: DirectoryOrCreate
      - name: dev
        hostPath:
          path: /dev
      - name: proc
        hostPath:
          path: /proc
      - name: sys
        hostPath:
          path: /sys
      tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
      nodeSelector:
        kubernetes.io/os: linux

---
# ServiceAccount for LocalPV Provisioner
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openebs-localpv-provisioner
  namespace: openebs
  labels:
    name: openebs-localpv-provisioner
    openebs.io/component-name: openebs-localpv-provisioner

---
# ClusterRole for LocalPV Provisioner
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openebs-localpv-provisioner
  labels:
    name: openebs-localpv-provisioner
    openebs.io/component-name: openebs-localpv-provisioner
rules:
- apiGroups: [""]
  resources: ["nodes", "persistentvolumes", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding for LocalPV Provisioner
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openebs-localpv-provisioner
  labels:
    name: openebs-localpv-provisioner
    openebs.io/component-name: openebs-localpv-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openebs-localpv-provisioner
subjects:
- kind: ServiceAccount
  name: openebs-localpv-provisioner
  namespace: openebs

---
# LocalPV Provisioner Deployment (with PVC Manager enabled)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openebs-localpv-provisioner
  namespace: openebs
  labels:
    name: openebs-localpv-provisioner
    openebs.io/component-name: openebs-localpv-provisioner
    openebs.io/version: dev
spec:
  selector:
    matchLabels:
      name: openebs-localpv-provisioner
      openebs.io/component-name: openebs-localpv-provisioner
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        name: openebs-localpv-provisioner
        openebs.io/component-name: openebs-localpv-provisioner
        openebs.io/version: dev
    spec:
      serviceAccount: openebs-localpv-provisioner
      containers:
      - name: openebs-provisioner-hostpath
        imagePullPolicy: IfNotPresent
        image: openebs/provisioner-localpv:1.0.0
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: OPENEBS_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: OPENEBS_SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
        - name: OPENEBS_IO_ENABLE_ANALYTICS
          value: "true"
        - name: OPENEBS_IO_INSTALLER_TYPE
          value: "openebs-operator"
        - name: OPENEBS_IO_HELPER_IMAGE
          value: "openebs/linux-utils:latest"
        # Enable PVC Manager mode
        - name: OPENEBS_IO_ENABLE_PVC_MANAGER
          value: "true"
        - name: OPENEBS_IO_PVC_MANAGER_PORT
          value: "8080"
        livenessProbe:
          exec:
            command:
            - pgrep
            - ".*provisioner"
          initialDelaySeconds: 30
          periodSeconds: 60
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi

---
# StorageClass for HostPath LocalPV with PVC Manager
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: openebs-hostpath-pvc-manager
  annotations:
    openebs.io/cas-type: local
    cas.openebs.io/config: |
      - name: StorageType
        value: "hostpath"
      - name: BasePath
        value: "/var/openebs/local"
provisioner: openebs.io/local
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true

