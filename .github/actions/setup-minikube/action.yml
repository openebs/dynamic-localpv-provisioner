name: Setup Minikube K8s Cluster

description: Setup Minikube K8s Cluster

inputs:
  kubernetes-version:
    description: Version of K8s to install
    required: true
  minikube-version:
    description: Version of minikube to install
    required: false
    default: 1.38.0

runs:
  using: composite
  steps:
    # TODO: Drop this step once medyagh/setup-minikube releases a version which
    # carries the fix from medyagh/setup-minikube#836. Until then its none-driver
    # setup runs a bare 'chmod 755 /etc/cni/net.d', which dies on the runner
    # images that no longer ship that directory (medyagh/setup-minikube#835):
    #   chmod: cannot access '/etc/cni/net.d': No such file or directory
    - name: Ensure the CNI configuration directory exists
      shell: bash
      run: sudo mkdir -p /etc/cni/net.d

    - name: Setup Minikube-Kubernetes
      uses: medyagh/setup-minikube@latest
      with:
        cache: false
        minikube-version: ${{ inputs.minikube-version }}
        driver: none
        kubernetes-version: ${{ inputs.kubernetes-version }}
        cni: calico
        start-args: "--install-addons=false"

    - name: Setting environment variables
      shell: bash
      run: |
        echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV
