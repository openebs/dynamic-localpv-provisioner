name: Setup Go

description: Setup Go

runs:
  using: composite
  steps:
    - name: Set up Go 1.24.12
      uses: actions/setup-go@v6
      with:
        go-version: 1.24.12
        cache: false

    - name: Set go env
      shell: bash
      run: |
        echo "GOPATH=$(go env GOPATH)" >> $GITHUB_ENV
        echo "GOCACHE=$(go env GOCACHE)" >> $GITHUB_ENV
