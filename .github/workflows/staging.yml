name: Staging Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v4.5.0)'
        required: true
        type: string

env:
  TAG: ${{ inputs.tag }}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    with:
      tag: ${{ inputs.tag }}

  tests:
    needs: ["lint"]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/tests.yml
    with:
      coverage: false

  provisioner-localpv:
    needs: ['lint']
    runs-on: cncf-ubuntu-16-64-x86
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix
        with:
          preFetchNix: ./shell.nix

      - name: Check if the chart is publishable
        run: |
          nix-shell --pure --run "./scripts/update-chart-version.sh --tag ${TAG} --publish-release" shell.nix

      - name: Set Image Org
        run: |
          [ -z "${{ secrets.IMAGE_ORG }}" ] && IMAGE_ORG=openebs || IMAGE_ORG=${{ secrets.IMAGE_ORG}}
          echo "IMAGE_ORG=${IMAGE_ORG}" >> $GITHUB_ENV

      - name: Set IMAGE_TAG and BRANCH
        run: |
          BRANCH=${{ github.ref_name }}
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "IMAGE_TAG=$(awk -F': ' '/^version:/ {print $2}' deploy/helm/charts/Chart.yaml)" >> $GITHUB_ENV

      - name: Set Build Date
        id: date
        run: |
          echo "DATE=$(date -u +'%Y-%m-%dT%H:%M:%S%Z')" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ env.IMAGE_ORG }}/dev/provisioner-localpv
          tags: |
            type=raw,value=latest,enable=false
            type=raw,value=${{ env.IMAGE_TAG }}

      - name: Print Tag info
        run: |
          echo "BRANCH: ${{ env.BRANCH }}"
          echo "RELEASE_TAG: ${{ steps.docker_meta.outputs.tags }}"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: v0.13.1

      - uses: ./.github/actions/registry-login
        with:
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./buildscripts/provisioner-localpv/provisioner-localpv.Dockerfile
          push: true
          platforms: linux/amd64, linux/arm64, linux/arm/v7, linux/ppc64le
          tags: |
            ${{ steps.docker_meta.outputs.tags }}
          build-args: |
            DBUILD_DATE=${{ steps.date.outputs.DATE }}
            DBUILD_REPO_URL=https://github.com/openebs/dynamic-localpv-provisioner
            DBUILD_SITE_URL=https://openebs.io
            BRANCH=${{ env.BRANCH }}

  release-chart:
    runs-on: ubuntu-22.04
    needs: ['tests', 'provisioner-localpv']
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix
        with:
          preFetchNix: ./shell.nix

      - name: Set Image Org
        run: |
            [ -z "${{ secrets.IMAGE_ORG }}" ] && IMAGE_ORG=openebs || IMAGE_ORG=${{ secrets.IMAGE_ORG}}
            echo "IMAGE_ORG=${IMAGE_ORG}" >> $GITHUB_ENV

      - name: Check if the chart is publishable
        run: |
            nix-shell --pure --run "./scripts/update-chart-version.sh --tag ${TAG} --publish-release" shell.nix

      - name: Update the registry and repository in values.yaml
        run: |
            nix-shell --pure --run "./scripts/update-reg-repo.sh --registry ghcr.io/ --repository ${{ env.IMAGE_ORG }}/dev/provisioner-localpv" shell.nix

      - name: Set Chart Version
        run: |
            TAG=$(awk -F': ' '/^version:/ {print $2}' deploy/helm/charts/Chart.yaml)
            echo "VERSION=${TAG#v}" >> $GITHUB_ENV

      - name: Push chart to staging repo
        uses: appany/helm-oci-chart-releaser@v0.5.0
        with:
            name: localpv-provisioner
            repository: ${{ env.IMAGE_ORG }}/helm
            tag: ${{ env.VERSION }}
            path: ./deploy/helm/charts
            registry: ghcr.io
            registry_username: ${{ github.actor }}
            registry_password: ${{ secrets.GITHUB_TOKEN }}
            update_dependencies: 'true'
