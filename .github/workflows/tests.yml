name: Tests

on:
  workflow_call:
    inputs:
      coverage:
        description: Upload code coverage
        required: false
        default: true
        type: boolean

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Unit test
        run: |
          nix-shell --run "make test"
          nix-shell --run "nixfmt **/*.nix"

      - name: Verify corrections
        run: make verify-src

      # todo: this coverage was previously not reported, and since the value is rather low
      # it's failing the checks
      # Also the bdd coverage is incorrect, it's not collecting the data from the pods...
      # P. S.: Above comes directly out of openebs/zfs-localpv. I lack context here, won't worry
      # about this for now.
      - uses: codecov/codecov-action@v5
        if: inputs.coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage
          flags: unittests
          fail_ci_if_error: true
          dry_run: true

  integration-test:
    runs-on: ubuntu-22.04
    needs: ["unit-tests"]
    strategy:
      fail-fast: true
      matrix:
        kubernetes: [v1.34.3]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-go

      - name: Build images locally
        run: make provisioner-localpv-image

      - uses: ./.github/actions/setup-minikube
        with:
          kubernetes-version: ${{ matrix.kubernetes }}

      - name: Set up infra for integration test
        run: sudo apt-get update && sudo apt-get install -y xfsprogs quota linux-modules-extra-`uname -r`

      - name: Integration test
        run: |
          make bootstrap
          make helm-install
          make integration-test

      - uses: codecov/codecov-action@v5
        if: inputs.coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          files: ./tests/integration_coverage.txt
          flags: integrationtests
          fail_ci_if_error: true

  results:
    runs-on: ubuntu-22.04
    needs: ['integration-test']
    if: ${{ !cancelled() }}
    steps:
      - if: ${{ needs.integration-test.result != 'success' }}
        run: exit 1
      - run: exit 0
