# Default values for localpv.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# NOTE: This option is required so that .global.imageRegistry works as an override
#       for the local image registry values. By default, this option is set to false
#       and that's to retain backwards compatibility with v4.4.0 where .global.imageRegistry
#       was introduced as the default and the local options were overrides for the global default.
#       The other .global options do not work this way, and they are all overrides for their
#       respective options. If you're not upgrading from v4.4.0, you'll want to enable
#       this option (set to 'true').
globalImageRegistryOverride: false

global:
  # Global override for container image registry (when `globalImageRegistryOverride` is set to true)
  imageRegistry: "docker.io"
  # Global image pull secrets (merged with local imagePullSecrets and not overridden)
  # - secret
  imagePullSecrets: []
  # Global override for image pull policy
  imagePullPolicy: ""
  analytics:
    # Global override for analytics
    enabled:

rbac:
  # rbac.create: `true` if rbac resources should be created
  create: true
  # rbac.pspEnabled: `true` if PodSecurityPolicy resources should be created
  pspEnabled: false

earlyEvictionTolerations:
  - effect: NoExecute
    key: node.kubernetes.io/unreachable
    operator: Exists
    tolerationSeconds: 5
  - effect: NoExecute
    key: node.kubernetes.io/not-ready
    operator: Exists
    tolerationSeconds: 5

localpv:
  name: localpv-provisioner
  enabled: true
  controller:
    # The number of concurrent worker goroutines for processing PVC create and delete events.
    # Higher values increase provisioning throughput when many PVC events are received simultaneously.
    workers: 4
    # Client-side rate limits for requests to the Kubernetes API server.
    client:
      # Maximum queries per second (QPS) the provisioner sends to the Kubernetes API server.
      # Leave empty to use the client-go default (5). Raise it alongside `workers` to avoid
      # client-side throttling when provisioning many volumes concurrently.
      qps: ""
      # Maximum burst of queries above `client.qps` the provisioner allows to the Kubernetes
      # API server. Leave empty to use the client-go default (10). Setting `client.qps`
      # without `client.burst` leaves burst at the client-go default of 10, which may
      # throttle bursts well below the configured QPS; prefer setting both together.
      burst: ""
  image:
    registry: ""
    repository: openebs/provisioner-localpv
    tag: 4.6.1-prerelease
    pullPolicy: IfNotPresent
  updateStrategy:
    type: RollingUpdate
  # If set to false, containers created by the localpv provisioner will run without extra privileges.
  privileged: true
  annotations: {}
  podAnnotations: {}
  ## Labels to be added to localpv provisioner deployment pods
  podLabels:
    name: openebs-localpv-provisioner
  healthCheck:
    # Container port the provisioner serves its HTTP health endpoints on:
    #  /healthz (liveness) and /readyz (readiness).
    port: 8081
    liveness:
      # Enable the liveness probe (httpGet /healthz).
      enabled: true
      # No. of failures the liveness probe will tolerate.
      failureThreshold: 3
      # No. of seconds of delay before checking the liveness status.
      initialDelaySeconds: 1
      # No. of seconds between liveness probe checks.
      periodSeconds: 30
      # No. of seconds of timeout tolerance.
      timeoutSeconds: 5
    readiness:
      # Enable the readiness probe (httpGet /readyz).
      enabled: true
      # No. of failures the readiness probe will tolerate.
      failureThreshold: 3
      # No. of seconds of delay before checking the readiness status.
      initialDelaySeconds: 1
      # No. of seconds between readiness probe checks.
      periodSeconds: 20
      # No. of seconds of timeout tolerance.
      timeoutSeconds: 5
  replicas: 1
  enableLeaderElection: true
  basePath: "/var/openebs/local"
  # Node deployment configuration for distributed provisioning mode
  nodeDeployment:
    # Enable the NodeDeployment mode. This deploys the provisioner as a DaemonSet on
    # cluster nodes. NodeDeployment avoids the need to spin up a HelperPod at volume
    # creation/deletion time, and instead performs volume operations via the DaemonSet
    # container.
    # NOTE: This mode mounts the host '/' path on to container, as it does not use a
    # HelperPod and must be able to cater to different BasePath paths.
    enabled: false
    # Additional volume mounts for the provisioner container
    additionalVolumeMounts: []
    # Additional volumes for the provisioner pod
    additionalVolumes: []
  # Enabling (setting to 'true') this option enables namespaced PVC tenants to be able
  #  to set the BasePath cas-config value of their hostpath volume via PVC annotations.
  #  It's reasonable to want to not allow the namespace tenant to decide this for
  #  themselves, and to only allow setting BasePath via the StorageClass/default env
  #  (at a cluster admin level). The default value 'false' does not allow namespace tenants
  #  to set BasePath via PVC cas-config annotations.
  allowInsecurePvcBasePathOverride: false
  resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  #  limits:
  #    cpu: 100m
  #    memory: 128Mi
  #  requests:
  #    cpu: 100m
  #    memory: 128Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext: {}
  ## Sets priorityClassName in pod
  priorityClassName: ""

imagePullSecrets:
# - name: img-pull-secret
podSecurityContext: {}
# fsGroup: 2000

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name:

hostpathClass:
  # Name of the default hostpath StorageClass
  name: openebs-hostpath
  # If true, enables creation of the openebs-hostpath StorageClass
  enabled: true
  # Available reclaim policies: Delete/Retain, defaults: Delete.
  reclaimPolicy: Delete
  # If true, sets the openebs-hostpath StorageClass as the default StorageClass
  isDefaultClass: false
  # Path on the host where local volumes of this storage class are mounted under.
  # NOTE: If not specified, this defaults to the value of localpv.basePath.
  basePath: ""
  # Custom node affinity label(s) for example "openebs.io/node-affinity-value"
  # that will be used instead of hostnames
  # This helps in cases where the hostname changes when the node is removed and
  # added back with the disks still intact.
  # Example:
  #          nodeAffinityLabels:
  #            - "openebs.io/node-affinity-key-1"
  #            - "openebs.io/node-affinity-key-2"
  nodeAffinityLabels: []
  # Custom allowedTopologies for the openebs-hostpath StorageClass. Restricts the
  # set of nodes where volumes of this StorageClass may be provisioned/scheduled,
  # by matching node labels. See:
  # https://kubernetes.io/docs/concepts/storage/storage-classes/#allowed-topologies
  # Example:
  #          allowedTopologies:
  #            - matchLabelExpressions:
  #                - key: kubernetes.io/hostname
  #                  values:
  #                    - worker-2
  #                    - worker-3
  allowedTopologies: []
  # Prerequisite: XFS Quota requires an XFS filesystem mounted with
  # the 'pquota' or 'prjquota' mount option.
  xfsQuota:
    # If true, enables XFS project quota
    enabled: false
    # Detailed configuration options for XFS project quota.
    # If XFS Quota is enabled with the default values, the usage limit
    # is set at the storage capacity specified in the PVC.
    softLimitGrace: "0%"
    hardLimitGrace: "0%"
  # Prerequisite: EXT4 Quota requires an EXT4 filesystem mounted with
  # the 'prjquota' mount option.
  ext4Quota:
    # If true, enables EXT4 project quota
    enabled: false
    # Detailed configuration options for EXT4 project quota.
    # If EXT4 Quota is enabled with the default values, the usage limit
    # is set at the storage capacity specified in the PVC.
    softLimitGrace: "0%"
    hardLimitGrace: "0%"

helperPod:
  image:
    registry: ""
    repository: openebs/linux-utils
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    tag: 4.6.0
  hostNetwork: false
  # The maximum number of seconds to wait for a helperPod (init, cleanup, quota) to complete before timing out.
  timeoutSecs: 120

# Additional labels to add to all chart resources
extraLabels: {}

loggingLabels:
  openebs.io/logging: "true"

analytics:
  # Enable sending stats to Google Analytics
  enabled: true
  # Specify in hours the duration after which a ping event needs to be sent.
  pingInterval: "24h"
