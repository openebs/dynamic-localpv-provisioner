{{/*
Chart-managed resources for cluster analytics:
  * ConfigMap
    Records whether the install event has been emitted for the current
    Helm release. Controller patches an `installed-at` key into .data on
    first emit; subsequent restarts (helper-pod mode) or leadership
    transitions (node-deployment mode) see the key and skip re-emission.
    helm uninstall removes it, so a fresh install correctly re-fires
    install. Used by both deployment modes.

  * Lease (<fullname>-analytics) — node-deployment mode only
    Elects a single analytics emitter across DaemonSet pods. Helm-managed
    so uninstall cleanly removes it; without this, the Lease would
    persist with the previous holder's identity and the next install
    would have to wait out LeaseDuration before acquiring leadership.
    spec is empty here; client-go fills holderIdentity, acquireTime, etc.
    at runtime, and Helm's three-way merge preserves those fields on
    upgrades because they are absent from this template.
*/}}
{{- if .Values.localpv.enabled }}
{{- $analyticsEnabled := .Values.analytics.enabled -}}
{{- if kindIs "bool" .Values.global.analytics.enabled -}}
  {{- $analyticsEnabled = .Values.global.analytics.enabled -}}
{{- end -}}
{{- if $analyticsEnabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "localpv.analyticsStateCM.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "localpv.labels" . | nindent 4 }}
    {{- if .Values.extraLabels -}}
      {{- toYaml .Values.extraLabels | nindent 4 }}
    {{- end }}
data: {}
{{- if .Values.localpv.nodeDeployment.enabled }}
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: {{ include "localpv.analyticsLease.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "localpv.labels" . | nindent 4 }}
    {{- if .Values.extraLabels -}}
      {{- toYaml .Values.extraLabels | nindent 4 }}
    {{- end }}
spec: {}
{{- end }}
{{- end }}
{{- end }}
